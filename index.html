<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1d24">
<link rel="icon" id="favicon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>typeburst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1b1d24; --bg2:#23262f; --dim:#565c70; --text:#dde1ec; --err:#ff5c6c;
  --accent:#6ee7f2; --glow:110,231,242;
  --t0:#6ee7f2; --t1:#9d8cff; --t2:#ff5fa2; --t3:#ffc857; --t4:#7dffb0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%; margin:0; background:var(--bg); color:var(--text); overflow:hidden; touch-action:manipulation;
  font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Hiragino Sans","Noto Sans JP",monospace;
  display:grid; place-items:center;
}
[hidden]{display:none!important}
body.scrollable{overflow-x:hidden; overflow-y:auto}
#glow{position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(60% 45% at 50% 55%, rgba(var(--glow),.12), transparent 70%); opacity:.5}
#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:5}
#flash{position:fixed; inset:0; background:var(--accent); opacity:0; pointer-events:none; z-index:6}

#cam{width:min(960px,92vw); position:relative; z-index:2}
#stage{display:flex; flex-direction:column; gap:3rem}
header{position:relative; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; font-size:14px; color:var(--dim)}
.brand{font-weight:800; font-size:20px; color:var(--text); letter-spacing:-.02em; display:flex; align-items:center; gap:.5rem}
.brand::before{content:""; width:.55em; height:1em; background:var(--accent); border-radius:2px; box-shadow:0 0 10px var(--accent); transition:background .2s}
.opts{display:flex; gap:1.25rem; background:var(--bg2); padding:.45rem .9rem; border-radius:10px; flex-wrap:wrap}
.group{display:flex; gap:.15rem; align-items:center}
.group span{margin-right:.3rem}
button{font:inherit; color:var(--dim); background:none; border:0; padding:.25rem .45rem; border-radius:6px; cursor:pointer; transition:color .15s}
button:hover{color:var(--text)}
button.on{color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button.ic{display:inline-flex; align-items:center; padding:.25rem .35rem}
.play{display:flex; align-items:center; gap:.2rem; border:1px solid transparent; border-radius:8px; padding:0 .25rem; transition:border-color .2s}
.play.hard{border-color:var(--err)}
.play.hardcore{border:2px solid var(--err); animation:hcPulse 1.6s ease-in-out infinite}
body.fx0 .play.hardcore{animation:none}
@keyframes hcPulse{50%{box-shadow:0 0 12px color-mix(in srgb, var(--err) 60%, transparent)}}
.play .sep{width:1px; height:1.1em; background:var(--dim); opacity:.45; margin:0 .15rem}
.group[data-key="mode"] button{display:inline-flex; align-items:center; gap:1px}
.group[data-key="mode"] button.on{color:var(--err)}
.group[data-key="mode"] small{font-size:.8em; margin-left:.25rem}
.meter{align-items:center}
.meter button{display:inline-flex; align-items:flex-end; height:24px; padding:.2rem .16rem}
.meter .bar{display:block; width:7px; border-radius:2px; background:var(--dim); opacity:.4; transition:background .15s, opacity .15s}
.meter button:nth-of-type(1) .bar{height:7px} .meter button:nth-of-type(2) .bar{height:12px} .meter button:nth-of-type(3) .bar{height:17px}
.meter button.lit .bar{background:var(--accent); opacity:1; box-shadow:0 0 6px color-mix(in srgb, var(--accent) 60%, transparent)}
.meter:hover button:not(.lit) .bar{background:var(--text); opacity:.6}
.meter button:hover ~ button:not(.lit) .bar{background:var(--dim); opacity:.4}
.meter button:hover ~ button.lit .bar{opacity:.35; box-shadow:none}
#soundBtn .x{display:none}
#soundBtn.muted .x{display:inline}
#soundBtn:not(.muted){color:var(--accent)}
.sw{display:inline-block; width:.85em; height:.85em; border-radius:50%; vertical-align:-.1em; border:2px solid var(--bg2); box-shadow:0 0 0 1px var(--dim)}
#themeBtn{display:inline-flex; align-items:center; gap:.4rem}
#ruleCard{position:absolute; top:calc(100% + .5rem); left:50%; transform:translateX(-50%); z-index:11; width:min(420px,92vw);
  background:var(--bg2); border:2px solid var(--err); border-radius:12px; padding:1rem 1.1rem; box-shadow:0 12px 32px rgba(0,0,0,.35); color:var(--text)}
#ruleCard b{color:var(--err); font-size:16px}
#ruleCard p{margin:.5rem 0 .8rem; font-size:14px; line-height:1.6}
#ruleOk{background:var(--err); color:var(--bg); font-weight:800; padding:.35rem 1.2rem}
#ruleHint.danger{color:var(--err)}
#themePanel{position:absolute; top:calc(100% + .5rem); right:0; z-index:10; display:grid; grid-template-columns:repeat(5,1fr); gap:.5rem;
  background:var(--bg2); padding:.7rem; border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.35); width:min(560px,92vw)}
#themePanel button{display:flex; flex-direction:column; gap:.35rem; align-items:stretch; padding:.35rem; font-size:12px; border:2px solid transparent}
#themePanel button.on{border-color:var(--accent); color:var(--text)}
.pv{display:flex; align-items:center; gap:8px; height:40px; padding:6px 8px; border-radius:6px; box-shadow:inset 0 0 0 1px rgba(128,128,128,.3)}
.pv svg{flex:none; display:block}
.pv .bars{flex:1; display:flex; align-items:flex-end; gap:2px; height:100%}
.pv .bars i{flex:1; border-radius:2px}
.tsw{display:inline-grid; place-items:center; width:20px; height:20px; border-radius:5px; background:var(--bg); box-shadow:0 0 0 1px var(--dim)}
.tsw svg{display:block}

#game{display:flex; flex-direction:column; gap:.9rem}
.hud{display:flex; align-items:baseline; flex-wrap:wrap; column-gap:1.4rem; row-gap:.2rem; font-size:clamp(20px,2.6vw,30px); min-height:1.5em}
#timer{color:var(--accent); font-weight:600; display:inline-block}
#timer.hurry{color:var(--err)}
#score{font-weight:800; display:inline-block; font-variant-numeric:tabular-nums}
#mult{font-style:normal; color:var(--accent); font-weight:800; font-size:.62em; margin-left:.45em; display:inline-block}
#combo{color:var(--accent); opacity:0; transition:opacity .2s}
#combo.live{opacity:1}
#combo b{display:inline-block; font-weight:800}
#combo small{font-size:.55em; color:var(--dim); margin-left:.35em}
.word.crit span{color:color-mix(in srgb, var(--crit) 70%, transparent); text-shadow:0 0 10px color-mix(in srgb, var(--crit) 55%, transparent)}
.word.crit span.ok{color:var(--crit)}
#bestTag{color:var(--dim); font-size:.5em}
#bestTag.hit{color:var(--accent); font-weight:800}
#stageTag{display:none; color:var(--accent); font-weight:800; font-size:.7em}
body.fever #stageTag{display:inline-block; animation:hue 1.2s linear infinite}
#modeTag{color:var(--err); font-weight:800; font-size:.5em; letter-spacing:.08em; text-transform:uppercase}

#gauge{height:6px; background:var(--bg2); border-radius:3px; overflow:hidden}
#gauge i{display:block; height:100%; background:var(--accent); transform-origin:left; transform:scaleX(0);
  transition:transform .12s ease-out; box-shadow:0 0 12px var(--accent)}
#gauge.charged{animation:gshake .09s steps(2) infinite}
#gauge.charged i{animation:hue .5s linear infinite}
body.fever #gauge i{background:linear-gradient(90deg,var(--t2),var(--t3),var(--t4),var(--t0),var(--t1))}
@keyframes gshake{50%{transform:translateY(-1.5px)}}

#reading{min-height:2.6em; font-size:clamp(16px,2vw,21px); line-height:1.3; font-family:"Hiragino Sans","Noto Sans JP",sans-serif}
#reading .rt{color:var(--dim)}
#reading .rt b{font-weight:400; color:var(--text)}
#reading .rt .done{color:color-mix(in srgb, var(--dim) 55%, transparent)}
#reading .rk{font-size:.62em; color:var(--dim); margin-top:.2em; letter-spacing:.04em}
#reading .rk b{font-weight:400; color:var(--accent)}
#words-wrap{position:relative; font-size:clamp(20px,2.6vw,30px); line-height:1.6; height:4.8em; overflow:hidden; user-select:none; -webkit-user-select:none}
#words{display:flex; flex-wrap:wrap; column-gap:.6em}
.word{white-space:nowrap}
.word span{display:inline-block; color:var(--dim); transition:color .08s, opacity .15s}
.word span.ok{color:var(--text)}
.word span.bad{color:var(--err)}
.word span.extra{color:var(--err); opacity:.6}
.word.wrong{background:linear-gradient(var(--err),var(--err)) bottom/100% 2px no-repeat}
.word.shattered span{opacity:.14}
.pop{animation:pop .22s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:translateY(-.2em) scale(1.4); color:var(--accent); text-shadow:0 0 14px var(--accent)}}
#caret{position:absolute; left:0; top:0; width:3px; height:1em; background:var(--accent); border-radius:2px;
  box-shadow:0 0 10px var(--accent); transition:transform .09s ease-out, background .2s}
#caret.idle{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes hue{to{filter:hue-rotate(360deg)}}

body.fever #caret, body.fever .brand::before{animation:hue 1.2s linear infinite}
body.fever #glow{opacity:.8}
body.fever2 #glow{opacity:1}
body.fever3 #glow{animation:hue 2s linear infinite}
body.fever2:not(.fx0) .word span.ok, body.fever2:not(.fx0) #score{text-shadow:-2px 0 rgba(255,40,120,.55), 2px 0 rgba(40,220,255,.55)}
body.fever3:not(.fx0) #words-wrap{animation:rgbjit .14s steps(2) infinite}
body.fever4 #glow{animation:hue .9s linear infinite; opacity:1}
body.fever5:not(.fx0) #words-wrap{animation:rgbjit2 .1s steps(2) infinite}
body.fever5 #stageTag{font-size:.9em; letter-spacing:.06em}
@keyframes rgbjit2{50%{filter:drop-shadow(-5px 0 rgba(255,0,100,.6)) drop-shadow(5px 0 rgba(0,220,255,.6))}}
#cutin{position:fixed; inset:0; pointer-events:none; z-index:7; overflow:hidden; display:grid; place-items:center}
#cutin .band{position:absolute; left:-15%; width:130%; top:50%; height:clamp(90px,20vh,190px); margin-top:calc(clamp(90px,20vh,190px) / -2);
  transform:rotate(-7deg); background:linear-gradient(90deg, var(--accent), var(--hi) 50%, var(--accent)); opacity:.9}
#cutin b{position:relative; font-size:clamp(44px,11vw,150px); font-weight:800; font-style:italic; letter-spacing:-.02em; white-space:nowrap;
  color:var(--bg); transform:rotate(-7deg)}
#cutin.soft .band{display:none}
#cutin.soft b{color:var(--accent)}
#vignette{position:fixed; inset:0; pointer-events:none; z-index:4; opacity:0;
  background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.55) 100%)}
@keyframes rgbjit{50%{filter:drop-shadow(-3px 0 rgba(255,0,100,.5)) drop-shadow(3px 0 rgba(0,220,255,.5))}}

.hint{color:var(--dim); font-size:13px; display:flex; flex-wrap:wrap; align-items:center; gap:1.5rem; margin:0}
kbd{background:var(--bg2); padding:.1em .45em; border-radius:4px; color:var(--text); font:inherit}
#restartBtn{padding:0; color:var(--dim)}
#restartBtn:hover{color:var(--text)}
#kb{position:absolute; left:0; top:0; width:1px; height:1px; opacity:0; border:0; padding:0;
  font-size:16px; caret-color:transparent; background:transparent; color:transparent}
#tapcover{position:absolute; inset:0; display:grid; place-items:center; color:var(--text);
  font-size:16px; background:color-mix(in srgb, var(--bg) 70%, transparent);
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); cursor:pointer; z-index:3}

#result{display:flex; flex-direction:column; gap:2rem}
.big{font-size:clamp(72px,13vw,150px); font-weight:800; color:var(--accent); line-height:1; letter-spacing:-.04em; font-variant-numeric:tabular-nums}
.big span{display:inline-block}
.big small{font-size:.18em; color:var(--dim); margin-left:.4em; letter-spacing:0; font-weight:400}
.stats{display:flex; gap:2.4rem; flex-wrap:wrap}
.stats span{display:block; color:var(--dim); font-size:14px; margin-bottom:.2rem}
.stats b{font-size:28px; font-weight:600}
.detail{display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:1.2rem 2.4rem; font-size:14px; color:var(--dim)}
.chart-head,.chart-axis{display:flex; justify-content:space-between}
.chart-axis{font-size:12px}
#rChart{display:block; width:100%; height:84px; margin:.4rem 0 .2rem; overflow:visible}
#rChart .ln{fill:none; stroke:var(--accent); stroke-width:2; vector-effect:non-scaling-stroke; stroke-linejoin:round}
#rChart .ar{fill:var(--accent); opacity:.12}
#rChart .gd{stroke:var(--bg2); stroke-width:1; vector-effect:non-scaling-stroke}
#rMiss{display:flex; flex-wrap:wrap; gap:.5rem .9rem; margin-top:.6rem; color:var(--text)}
#rMiss kbd{font-size:16px; color:var(--err)}
#rFail{color:var(--err); font-weight:600; margin:0}
#rNew{color:var(--accent); font-weight:600; margin:0; animation:blink .8s steps(1) 4}
.actions{display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap}
#again{color:var(--text); background:var(--bg2); padding:.6rem 1.3rem; border-radius:8px}
#again:hover{color:var(--accent)}
.share{display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; font-size:14px}
.share > span{color:var(--dim); margin-right:.3rem}
.share button{background:var(--bg2); padding:.35rem .8rem}

#recBtn{color:var(--text)}
#recBtn:hover{color:var(--accent)}
#records,#help{display:flex; flex-direction:column; gap:1.2rem}
#helpBtn{width:1.6em; height:1.6em; padding:0; border:1.5px solid currentColor; border-radius:50%; font-weight:800; line-height:1; display:inline-grid; place-items:center}
.help-body{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1.4rem 2.4rem; font-size:14px; line-height:1.6}
.help-body section{min-width:0}
.help-body h3{margin:0 0 .5rem; font-size:15px; color:var(--accent)}
.help-body p{margin:.3rem 0; color:var(--dim)}
.help-body p b{color:var(--text); font-weight:600}
.hrow{display:grid; grid-template-columns:auto auto 1fr; gap:.2rem .8rem; align-items:baseline; padding:.28rem 0; border-bottom:1px solid var(--bg2)}
.hrow .n{color:var(--text); font-weight:600; white-space:nowrap}
.hrow .x{color:var(--accent); font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap}
.hrow .d{color:var(--dim)}
.hrow.danger .n,.hrow.danger .x{color:var(--err)}
.hrow i.sw{margin-right:.4rem}
.rec-head{display:flex; justify-content:space-between; align-items:center; gap:1rem}
.rec-head h2{margin:0; font-size:22px; font-weight:800}
.rec-filters{display:flex; flex-wrap:wrap; gap:.6rem 1.2rem; font-size:14px}
.seg{display:flex; align-items:center; gap:.15rem; background:var(--bg2); padding:.25rem .35rem; border-radius:9px}
.seg > span{color:var(--dim); font-size:12px; margin:0 .35rem 0 .25rem}
.seg button.on{background:var(--bg); color:var(--accent)}
.best-card{position:relative; background:var(--bg2); border-radius:14px; padding:1.1rem 1.3rem; border:1px solid color-mix(in srgb, var(--accent) 35%, transparent)}
.bc-label{color:var(--dim); font-size:13px}
.bc-label b{color:var(--crit); font-weight:800; margin-right:.5rem}
.bc-score{font-size:clamp(40px,7vw,64px); font-weight:800; color:var(--accent); line-height:1.1; letter-spacing:-.03em; font-variant-numeric:tabular-nums; margin:.2rem 0 .5rem}
.bc-score small{font-size:.3em; color:var(--dim); font-weight:400; margin-left:.4em; letter-spacing:0}
.bc-new{display:inline-block; font-size:12px; font-weight:800; color:var(--bg); background:var(--accent); border-radius:4px; padding:.05rem .4rem; margin-left:.5rem; vertical-align:middle}
.bc-stats{display:flex; flex-wrap:wrap; gap:.3rem 1.3rem; font-size:13px; color:var(--dim)}
.bc-stats b{color:var(--text); font-size:16px; font-weight:600; margin-right:.25rem}
.bc-empty{color:var(--dim); font-size:15px; padding:.6rem 0}
.bc-empty small{display:block; font-size:13px; margin-top:.3rem}
.rec-tabs{display:flex; gap:1.2rem; border-bottom:1px solid var(--bg2)}
.rec-tabs button{padding:.4rem 0; border-radius:0; border-bottom:2px solid transparent; margin-bottom:-1px}
.rec-tabs button.on{color:var(--text); border-bottom-color:var(--accent)}
.rec-list{display:flex; flex-direction:column; font-size:14px; font-variant-numeric:tabular-nums}
.rrow{display:grid; grid-template-columns:2em 6.2em minmax(40px,1fr) 4.4em 3.6em; gap:.7rem; align-items:center; padding:.45rem .2rem; border-bottom:1px solid var(--bg2)}
.hrow2{display:grid; grid-template-columns:7.2em auto 1fr 4.4em; gap:.7rem; align-items:center; padding:.45rem .2rem; border-bottom:1px solid var(--bg2)}
.rrow .rk{font-weight:800; color:var(--dim); text-align:center}
.rk.r2{color:#c3cad6} .rk.r3{color:#d49a6a}
.rrow .sc,.hrow2 .sc{font-weight:800; text-align:right}
.rrow .bar{height:6px; background:var(--bg2); border-radius:3px; overflow:hidden}
.rrow .bar i{display:block; height:100%; background:var(--accent); opacity:.75; border-radius:3px}
.rrow .wpm,.hrow2 .wpm{text-align:right}
.rrow small,.hrow2 small{color:var(--dim); font-size:.75em; margin-left:.15em}
.rrow .dt,.hrow2 .dt{color:var(--dim); font-size:13px}
.rrow .dt{text-align:right}
.hrow2 .chip{font-size:12px; color:var(--text); background:var(--bg2); border-radius:6px; padding:.1rem .45rem; white-space:nowrap}
.rrow.now,.hrow2.now{background:color-mix(in srgb, var(--accent) 10%, transparent)}
.rrow.now .sc,.hrow2.now .sc{color:var(--accent)}
.rec-list .empty{color:var(--dim); margin:.8rem 0}
@media (max-width:700px){
  .help-body{grid-template-columns:1fr}
  .rrow{grid-template-columns:1.6em 5.4em minmax(30px,1fr) 3.8em 3.2em; gap:.45rem; font-size:13px}
  .hrow2{grid-template-columns:auto auto 1fr 3.8em; gap:.45rem; font-size:13px}
  .best-card{padding:.9rem 1rem}
  body{place-items:start center}
  #cam{padding-top:1rem; padding-bottom:1.5rem}
  #stage{gap:1.4rem}
  header{font-size:13px}
  .opts{gap:.6rem; padding:.35rem .6rem}
  #themePanel{grid-template-columns:repeat(2,1fr); left:0; right:0; width:auto}
  #words-wrap{font-size:22px}
  .hud{font-size:20px; column-gap:1rem}
  .big{font-size:64px}
  .stats{gap:1.4rem}
  .stats b{font-size:22px}
  #result{gap:1.3rem}
  .detail{grid-template-columns:1fr}
  #rChart{height:64px}
}
</style>
</head>
<body>
<div id="glow"></div>
<div id="cam"><main id="stage">
  <header>
    <div class="brand">typeburst</div>
    <nav class="opts" aria-label="設定">
      <div class="group" data-key="text" data-type="str"><button data-v="words">英単語</button><button data-v="sentence">英文</button><button data-v="roma">ローマ字</button></div>
      <div class="play" id="playBox">
        <div class="group" data-key="dur"><button data-v="30" title="30秒">30s</button><button data-v="60" title="60秒">60s</button></div>
        <i class="sep"></i>
        <div class="group" data-key="mode" data-type="str" data-toggle="normal">

/* ---------- tiers (combo) ---------- */
const TIERS=[0,20,50,100,200].map(at=>({at}));
const TIER_MULT=[1,2,3,4,5];
let tier=0;
const tierOf = c => { let t=0; TIERS.forEach((x,i)=>{ if(c>=x.at) t=i; }); return t; };
const accent = () => theme().tiers[tier];
const hi = () => theme().hi, errC = () => theme().err, critC = () => theme().light ? '#c98a00' : '#ffc857';

/* ---------- audio core ---------- */
let ac=null, master=null, noiseBuf=null;
function initAudio(){
  if(ac){ if(ac.state==='suspended') ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
  ac = new AC();
  const comp = ac.createDynamicsCompressor();
  master = ac.createGain(); master.gain.value = .6;
  master.connect(comp); comp.connect(ac.destination);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
}
const canPlay = () => settings.sound && ac;
function env(g,t,a,peak,dur){
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+a);
  g.gain.exponentialRampToValueAtTime(.0001,t+a+dur);
}
function tone(freq,type,t,dur,peak,dest=master,glideTo){
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo,t+dur);
  env(g,t,.004,peak,dur); o.connect(g); g.connect(dest);
  o.start(t); o.stop(t+dur+.05);
}
function noise(t,dur,peak,type,freq,q=1,sweepTo){
  const s=ac.createBufferSource(); s.buffer=noiseBuf;
  const f=ac.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(freq,t); f.Q.value=q;
  if(sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo,t+dur);
  const g=ac.createGain(); env(g,t,.003,peak,dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+.05);
}
function lowpass(freq){ const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq; f.connect(master); return f; }

/* ---------- music ---------- */
const mtof = m => 440*Math.pow(2,(m-69)/12);
const PROG=[{r:9,q:[0,3,7]},{r:5,q:[0,4,7]},{r:0,q:[0,4,7]},{r:7,q:[0,4,7]}]; // Am F C G
const ARP=[0,2,1,3,2,4,3,1];
let chordIdx=0, noteIdx=0;
const chord = () => PROG[chordIdx%PROG.length];
function chordTones(lo,hi){ const c=chord(), out=[];
  for(let m=lo;m<=hi;m++){ if(c.q.includes(((m-c.r)%12+12)%12)) out.push(m); } return out; }
const bassMidi = () => 33+((chord().r-9+12)%12);
let lastPling=0, plingN=0;
const sfx = {
  key(){ if(!canPlay()) return; const t=ac.currentTime;
    noise(t,.03,.14,'bandpass',3500+tier*400,1.4);
    tone(160,'sine',t,.04,.08,master,90);
    const tones=chordTones(64+tier*2,92);
    const i=Math.min(ARP[noteIdx%8]+(Math.floor(noteIdx/8)%2),tones.length-1), m=tones[i], f=mtof(m);
    tone(f,'triangle',t,.2,.13); tone(f*2,'sine',t,.1,.03);
    if(tier>=2 && i>0) tone(mtof(tones[i-1]),'sine',t,.24,.045);
    if(tier>=1 && !fstage && noteIdx%4===0) tone(mtof(bassMidi()+12),'triangle',t,.32,.15);
  },
  word(streak){ if(!canPlay()) return; const t=ac.currentTime;
    const tones=chordTones(72,100), f=mtof(tones[Math.min(streak-1,tones.length-1)]);
    tone(f,'triangle',t,.2,.16); tone(f*2,'sine',t+.01,.14,.05); tone(f*3,'sine',t+.035,.09,.025);
    noise(t,.08,.05,'highpass',6000);
  },
  pling(){ if(!canPlay()) return; const now=performance.now(); if(now-lastPling<35) return; lastPling=now;
    const tones=chordTones(84,108); tone(mtof(tones[plingN++%tones.length]),'sine',ac.currentTime,.05,.035);
  },
  miss(){ if(!canPlay()) return; const t=ac.currentTime;
    tone(150,'sine',t,.13,.22,master,65); noise(t,.06,.07,'lowpass',500);
  },
  tier(){ if(!canPlay()) return; const t=ac.currentTime, lp=lowpass(2600);
    chordTones(60,100).slice(2,7).forEach((m,i)=>tone(mtof(m),'sawtooth',t+i*.055,.22,.09,lp));
    noise(t,.4,.1,'highpass',700,.7,7000);
  },
  drop(st){ if(!canPlay()) return; const t=ac.currentTime, lp=lowpass(4000);
    tone(mtof(45),'sine',t,.7,.6,master,mtof(28));
    noise(t,1.0,.22,'highpass',2500,.5);
    chordTones(57,84).forEach(m=>tone(mtof(m),'sawtooth',t,.5,.05,lp));
    if(st>=2) chordTones(72,100).slice(0,4).forEach((m,i)=>tone(mtof(m),'square',t+.08+i*.05,.12,.045,lp));
    if(st>=3){ tone(mtof(93),'sine',t,.8,.05,master,mtof(105)); noise(t+.3,.8,.12,'highpass',6000,.5); }
    if(st>=4) tone(400,'sawtooth',t,.55,.06,lowpass(5000),1600); // 上昇音
    if(st>=5){ // 重いサブベースと和音の突き刺し
      tone(mtof(33),'sine',t,1.4,.7,master,mtof(24));
      [0,.16,.32].forEach(d=>chordTones(64,88).forEach(m=>tone(mtof(m),'sawtooth',t+d,.12,.04,lp)));
      noise(t,1.4,.2,'highpass',1800,.5,9000);
    }
  },
  down(){ if(!canPlay()) return; const t=ac.currentTime;
    tone(420,'sawtooth',t,.5,.12,lowpass(1400),45);
    noise(t,.4,.1,'lowpass',3000,.7,200);
  },
  tick(){ if(!canPlay()) return; tone(1100,'square',ac.currentTime,.03,.04); },
  count(e){ if(!canPlay()) return; tone(500+e*900,'square',ac.currentTime,.02,.025); },
  crit(){ if(!canPlay()) return; const t=ac.currentTime; // 明るい上昇アルペジオとベル
    [1046.5,1318.5,1568,2093].forEach((f,i)=>{ tone(f,'triangle',t+i*.045,.16,.12); tone(f*2,'sine',t+i*.045,.1,.03); });
    tone(2637,'sine',t+.2,1.1,.07); tone(3951,'sine',t+.2,.8,.03);
    noise(t,.5,.08,'highpass',5000,.6,11000);
  },
  record(){ if(!canPlay()) return; const t=ac.currentTime, lp=lowpass(3500); // 自己ベスト追い越しの短いファンファーレ
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,'triangle',t+i*.06,.2,.13));
    [523.25,783.99,1046.5].forEach(f=>tone(f,'sawtooth',t+.26,.6,.045,lp));
    noise(t+.24,.5,.09,'highpass',1500,.7,9000);
  },
  fanfare(best){ if(!canPlay()) return; const t=ac.currentTime, lp=lowpass(3000);
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,'triangle',t+i*.08,.25,.15));
    [523.25,659.25,783.99,1046.5].forEach(f=>{ tone(f,'triangle',t+.36,1.1,.07); tone(f/2,'sawtooth',t+.36,1.1,.04,lp); });
    noise(t+.34,.6,.1,'highpass',1200,.7,8000);
    if(best) [1568,2093,2637,3136].forEach((f,i)=>tone(f,'sine',t+.5+i*.07,.3,.05));
  }
};

/* 満タン直前のせり上がり音（ゲージ量に追従） */
let riser=null;
function riserUpdate(level){
  if(!canPlay()){ riserStop(); return; }
  const t=ac.currentTime;
  if(!riser){
    const o=ac.createOscillator(), o2=ac.createOscillator(); o.type=o2.type='sawtooth'; o2.detune.value=12;
    const f=ac.createBiquadFilter(); f.type='lowpass'; f.Q.value=6;
    const n=ac.createBufferSource(); n.buffer=noiseBuf; n.loop=true;
    const nf=ac.createBiquadFilter(); nf.type='highpass';
    const g=ac.createGain(), ng=ac.createGain(); g.gain.value=ng.gain.value=.0001;
    o.connect(f); o2.connect(f); f.connect(g); g.connect(master); n.connect(nf); nf.connect(ng); ng.connect(master);
    o.start(); o2.start(); n.start(); riser={o,o2,f,g,n,nf,ng};
  }
  const fr=110*Math.pow(2,level*2.5);
  riser.o.frequency.setTargetAtTime(fr,t,.08); riser.o2.frequency.setTargetAtTime(fr*1.5,t,.08);
  riser.f.frequency.setTargetAtTime(400+level*4000,t,.08);
  riser.g.gain.setTargetAtTime(.015+level*.05,t,.08);
  riser.nf.frequency.setTargetAtTime(1000+level*7000,t,.08);
  riser.ng.gain.setTargetAtTime(.01+level*.06,t,.08);
}
function riserStop(){
  if(!riser) return; const r=riser; riser=null; if(!ac) return; const t=ac.currentTime;
  r.g.gain.setTargetAtTime(.0001,t,.02); r.ng.gain.setTargetAtTime(.0001,t,.02);
  [r.o,r.o2,r.n].forEach(s=>{ try{ s.stop(t+.15); }catch(e){} });
}

/* ---------- gauge & fever stages ---------- */
const STAGE_NAMES=['','fever','super fever','hyper fever','ultra fever','LIMIT BREAK'], MAX_STAGE=5;
const STAGE_MULT=[1,2,3,4,5,6], STAGE_BPM=[0,128,140,152,164,176];
const GAIN_KEY=[1.6,1.5,1.4,1.3,1.2,1.1], GAIN_WORD=4, DRAIN=[0,3,4,5,6.5,8]; // 上の段階ほど貯まりにくく、減りやすい
let gauge=0, fstage=0, maxStage=0, feverT0=0, feverTime=0, schedId=0, step=0, nextT=0, lastMult=1;
const clock = () => ac ? ac.currentTime : performance.now()/1000;
const bpm = () => STAGE_BPM[fstage]+Math.min(12,combo/20);
const multiplier = () => TIER_MULT[tier]*STAGE_MULT[fstage]*MODE_MULT[settings.mode];

function addGauge(d){
  if(ended) return;
  gauge=Math.max(0,Math.min(100,gauge+d));
  if(gauge>=100 && fstage<MAX_STAGE) stageUp();
  else if(gauge<=0 && fstage>0) stageDown();
  syncGauge();
}
function syncGauge(){
  gaugeFill.style.transform=`scaleX(${gauge/100})`;
  const charged = gauge>=75 && fstage<MAX_STAGE && started && !ended;
  gaugeEl.classList.toggle('charged',charged);
  if(charged) riserUpdate((gauge-75)/25); else riserStop();
}
function setStageClass(){
  const b=document.body.classList;
  b.toggle('fever',fstage>=1); b.toggle('fever2',fstage>=2); b.toggle('fever3',fstage>=3); b.toggle('fever4',fstage>=4); b.toggle('fever5',fstage>=5);
  stageTag.textContent=STAGE_NAMES[fstage];
}
function updateMultUI(){
  const v=multiplier(); if(v===lastMult) return;
  const up=v>lastMult; lastMult=v; multEl.textContent='×'+v;
  multEl.animate([{transform:`scale(${up?1.8:.7})`},{transform:'scale(1)'}],{duration:260,easing:'cubic-bezier(.2,1.6,.4,1)'});
}
/* ヒットストップ：一瞬止めてズームし、解除と同時に弾けさせる。弱・reduced-motionでは無し */
let hitstopUntil=0;
function hitstop(k){
  if(settings.fx===0 || reduced) return false;
  const D=settings.fx===2?110:80; hitstopUntil=performance.now()+D;
  const kk=1+(k-1)*Math.min(mult(),1.4);
  cam.animate([{transform:'scale(1)'},{transform:`scale(${kk})`,offset:D/(D+300)},{transform:'scale(1)'}],{duration:D+300,easing:'ease-out'});
  return true;
}
function camPunch(s){
  if(settings.fx===0 || reduced) return;
  const k=1+(s-1)*Math.min(mult(),1.4);
  cam.animate([{transform:`scale(${k})`},{transform:'scale(1)'}],{duration:280,easing:'cubic-bezier(.2,1.4,.4,1)'});
}
function stageUp(){
  const was=fstage; fstage++; maxStage=Math.max(maxStage,fstage);
  if(was===0){ feverT0=performance.now(); step=0; nextT=clock()+.08; clearInterval(schedId); schedId=setInterval(schedule,25); }
  gauge = fstage<MAX_STAGE ? 35 : 100;
  riserStop(); sfx.drop(fstage); setStageClass(); updateMultUI();
  const m=mult(), [x,,r]=center(wrap), cy=r.top+r.height/2;
  floatText(x,r.top-16,STAGE_NAMES[fstage],fstage>=3?hi():accent(),34+fstage*8,true);
  for(let i=0;i<=fstage;i++) ring(x,cy,i%2?hi():accent(),Math.max(W,H)*(.3+i*.2),(6-i)*m);
  spark(x,cy,Math.round((60+fstage*40)*m),accent(),9+fstage*2,2.6);
  if(fstage>=2) spark(x,cy,Math.round(40*m),hi(),12,2);
  flash.animate([{opacity:(.18+fstage*.06)*Math.min(m,1.4)},{opacity:0}],{duration:520,easing:'ease-out'});
  shake=Math.max(shake,(8+fstage*3)*m);
  if(!hitstop(1.04+fstage*.025)) camPunch(1.04+fstage*.025);
  if(fstage===MAX_STAGE) cutIn(STAGE_NAMES[fstage]);
}
/* 最上段に上がったときのカットイン。弱・reduced-motionでは文字のフェードだけ */
function cutIn(text){
  const el=$('#cutin'), band=el.querySelector('.band'), b=el.querySelector('b'), soft=settings.fx===0||reduced;
  b.textContent=text; el.classList.toggle('soft',soft); el.hidden=false;
  const done=()=>{ el.hidden=true; };
  if(soft){ b.animate([{opacity:0},{opacity:1,offset:.2},{opacity:1,offset:.75},{opacity:0}],{duration:900}).onfinish=done; return; }
  band.animate([{transform:'rotate(-7deg) scaleX(0)',transformOrigin:'right'},{transform:'rotate(-7deg) scaleX(1)',transformOrigin:'right',offset:.14},
    {transform:'rotate(-7deg) translateX(0)',offset:.8},{transform:'rotate(-7deg) translateX(-120%)'}],{duration:900,easing:'ease-in-out'});
  b.animate([{transform:'rotate(-7deg) translateX(70vw)'},{transform:'rotate(-7deg) translateX(0)',offset:.18,easing:'linear'},
    {transform:'rotate(-7deg) translateX(-3vw)',offset:.8},{transform:'rotate(-7deg) translateX(-80vw)'}],{duration:900,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=done;
}
function stageDown(){
  fstage--; sfx.down();
  if(fstage===0){ clearInterval(schedId); feverTime+=(performance.now()-feverT0)/1000; gauge=0; }
  else gauge=60;
  setStageClass(); updateMultUI(); camPunch(.97);
  const [x,,r]=center(wrap); floatText(x,r.top-10,fstage?'stage down':'fever end',errC(),22);
}
function stopFever(){
  if(fstage>0) feverTime+=(performance.now()-feverT0)/1000;
  fstage=0; clearInterval(schedId); riserStop(); setStageClass();
}
/* ハードコア：1回ミスでその時点で終了（少し間を置いて結果へ） */
let runId=0;
function failRun(){
  if(ended) return;
  const at=Math.max(1,(performance.now()-t0)/1000), rid=runId;
  ended=true; clearInterval(timerId); stopFever(); syncGauge();
  const m=mult(), [x,,r]=center(wrap);
  sfx.down(); floatText(x,r.top-10,'MISS',errC(),30+14*Math.min(m,1.4),true);
  flash.animate([{opacity:.32*Math.min(m,1.4),background:errC()},{opacity:0,background:errC()}],{duration:600,easing:'ease-out'});
  shake=Math.max(shake,14*m); camPunch(.94);
  setTimeout(()=>{ if(rid===runId) end(at); },650);
}
/* ハードモード：ミス1回でコンボ・フィーバー・ゲージ・コード進行をすべて最初に戻す */
function hardReset(){
  const lost = combo>0 || gauge>0 || fstage>0;
  if(fstage>0) sfx.down();
  stopFever(); gauge=0; chordIdx=0; noteIdx=0; step=0;
  breakCombo(); syncGauge();
  if(!lost) return;
  const m=mult(), [x,,r]=center(wrap);
  floatText(x,r.top-10,'reset',errC(),26,true);
  shake=Math.max(shake,9*m); camPunch(.96);
}
function schedule(){ while(nextT<clock()+.12){ playStep(step%16,nextT); nextT+=60/bpm()/4; step++; } }
function playStep(s,t){
  if(s===0 && step>0) chordIdx++;
  if(canPlay()){
    if(s%4===0 || (fstage>=3 && (s===10||s===14))) tone(150,'sine',t,.2,.55,master,42);
    if(s%4===2) noise(t,fstage>=2?.1:.035,.12,'highpass',8000);
    else if(s%2===1) noise(t,.02,.04,'highpass',9000);
    if(s===4||s===12) noise(t,.12,.22,'bandpass',1600,.8);
    if(s%4===2||s===15) tone(mtof(bassMidi()+12),'sawtooth',t,.14,.09,lowpass(900));
    if(fstage>=2 && s%2===0){ const tn=chordTones(76,96); tone(mtof(tn[(s/2)%tn.length]),'square',t,.1,.03,lowpass(2400)); }
    if(fstage>=3){ const tn=chordTones(88,108); tone(mtof(tn[(s*3)%tn.length]),'sine',t,.06,.02); }

      const tn=chordTones(76,100); tone(mtof(tn[(s*5)%tn.length]+12),'triangle',t,.07,.022);

// かな1〜2文字 → ローマ字の候補（先頭がガイドに使う綴り）
const ROMA=(()=>{
  const t={}, add=(k,v)=>t[k]=v.split(' ');
  `あ a|い i yi|う u wu whu|え e|お o|か ka ca|き ki|く ku cu qu|け ke|こ ko co|さ sa|し shi si ci|す su|せ se ce|そ so|

や ya|ゆ yu|よ yo|ら ra|り ri|る ru|れ re|ろ ro|わ wa|を wo|が ga|ぎ gi|ぐ gu|げ ge|ご go|ざ za|じ ji zi|ず zu|ぜ ze|ぞ zo|
だ da|ぢ di|づ du|で de|ど do|ば ba|び bi|ぶ bu|べ be|ぼ bo|ぱ pa|ぴ pi|ぷ pu|ぺ pe|ぽ po|ゔ vu|ー -|
ぁ la xa|ぃ li xi|ぅ lu xu|ぇ le xe|ぉ lo xo|ゃ lya xya|ゅ lyu xyu|ょ lyo xyo|ゎ lwa xwa|っ ltu xtu ltsu xtsu|
きゃ kya|きゅ kyu|きょ kyo|きぇ kye|しゃ sha sya|しゅ shu syu|しょ sho syo|しぇ she sye|ちゃ cha tya cya|ちゅ chu tyu cyu|ちょ cho tyo cyo|ちぇ che tye cye|
にゃ nya|にゅ nyu|にょ nyo|ひゃ hya|ひゅ hyu|ひょ hyo|みゃ mya|みゅ myu|みょ myo|りゃ rya|りゅ ryu|りょ ryo|
ぎゃ gya|ぎゅ gyu|ぎょ gyo|じゃ ja zya jya|じゅ ju zyu jyu|じょ jo zyo jyo|じぇ je zye jye|ぢゃ dya|ぢゅ dyu|ぢょ dyo|
びゃ bya|びゅ byu|びょ byo|ぴゃ pya|ぴゅ pyu|ぴょ pyo|ふぁ fa|ふぃ fi|ふぇ fe|ふぉ fo|ふゅ fyu|てぃ thi|でぃ dhi|でゅ dhu|
とぅ twu|どぅ dwu|うぃ wi|うぇ we|うぉ who|ゔぁ va|ゔぃ vi|ゔぇ ve|ゔぉ vo|つぁ tsa`
    .split('|').forEach(x=>{ const [k,...v]=x.trim().split(' '); add(k,v.join(' ')); });
  return t;
})();
const toHira = s => s.replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60));
/* かな文字列を「打つ単位」ごとの候補リストに分ける。っ・ん は次の単位とまとめる */
function kanaUnits(kana){
  kana=toHira(kana); const base=[];
  for(let i=0;i<kana.length;){
    const two=kana.slice(i,i+2);
    if(two.length===2 && ROMA[two]){ // 拗音など：まとめ打ち＋分けて打つ
      const c=[...ROMA[two]]; ROMA[two[0]].forEach(a=>ROMA[two[1]].forEach(b=>c.push(a+b)));
      base.push({k:two,c}); i+=2; continue;
    }
    const one=kana[i];
    if(!ROMA[one] && one!=='ん') throw new Error('ローマ字にできない文字: '+one+' ('+kana+')');
    base.push({k:one,c:one==='ん'?null:[...ROMA[one]]}); i++;
  }
  const out=[];
  for(let i=base.length-1;i>=0;i--){
    const u=base[i], nx=out[0];
    if(u.k==='っ' && nx && !/^[あいうえおんっー]/.test(nx.k)){
      const c=[];
      nx.c.forEach(x=>{ if(!/^[aiueon-]/.test(x)){ if(x.startsWith('ch')) c.push('t'+x); c.push(x[0]+x); } });
      ROMA['っ'].forEach(t=>nx.c.forEach(x=>c.push(t+x)));
      out[0]={k:'っ'+nx.k, c:[...new Set(c)]};
    } else if(u.k==='ん'){
      if(nx){ const c=[];
        nx.c.forEach(x=>{ if(!/^[aiueoyn]/.test(x)) c.push('n'+x); });
        nx.c.forEach(x=>{ c.push('nn'+x); c.push('xn'+x); });
        out[0]={k:'ん'+nx.k, c:[...new Set(c)]};
      } else out.unshift({k:'ん', c:['nn','xn']});
    } else out.unshift({k:u.k, c:u.c});
  }
  return out;
}
/* 打った文字列が途中まで正しければ「打った分＋残りの第一候補」を返す。間違いなら null */
function romaMatch(units,typed){
  const rest = i => units.slice(i).map(u=>u.c[0]).join('');
  const rec = (i,s) => {
    if(i===units.length) return s==='' ? '' : null;
    for(const c of units[i].c) if(s.length>=c.length && s.startsWith(c)){ const r=rec(i+1,s.slice(c.length)); if(r!==null) return c+r; }
    for(const c of units[i].c) if(c.length>s.length && c.startsWith(s)) return c+rest(i+1);
    return null;
  };
  return rec(0,typed);
}

  const sec=Math.ceil(rem);
  if(sec!==lastSec){
    lastSec=sec; timerEl.textContent=sec;
    if(sec<=5){ timerEl.classList.add('hurry'); sfx.tick();
      timerEl.animate([{transform:'scale(1.35)'},{transform:'scale(1)'}],{duration:200,easing:'ease-out'}); }
  }
}
function breakCombo(){ combo=0; streak=0; if(tier>0) setTier(0); updateMultUI(); }

function onChar(ch){
  if(!started) start();
  let w=words[wi]; const idx=typed.length;
  if(idx>=w.length+8) return;
  let ok;
  if(isRoma()){ // 打った綴りに合わせてガイドを更新。間違いは入力を進めない
    const g=romaMatch(meta[wi].u,typed+ch); allKeys++; ok=!!g;
    if(ok){ typed+=ch; words[wi]=g; }
  } else { typed+=ch; allKeys++; ok = idx<w.length && w[idx]===ch; }
  renderWord(wi,typed); placeCaret();
  const span=wordEls[wi].children[Math.min(idx,wordEls[wi].children.length-1)];
  w=words[wi];
  if(ok){
    okKeys++; combo++; maxCombo=Math.max(maxCombo,combo);
    fxKey(span); sfx.key();
    noteIdx++; if(!fstage && noteIdx%16===0) chordIdx++;
    const nt=tierOf(combo);
    if(nt>tier){ setTier(nt); fxTier(); sfx.tier(); }
    score+=Math.round(10*multiplier());
    updateMultUI(); addGauge(GAIN_KEY[fstage]);
    if(isRoma() && typed===words[wi]){ updateCombo(true); submitWord(); return; } // 文節を打ち切ったら自動で確定
  } else {
    if(idx<w.length) missMap[w[idx]]=(missMap[w[idx]]||0)+1;
    if(crit[wi]){ crit[wi]=false; wordEls[wi].classList.remove('crit'); } // ミスすると金色は消える
    fxMiss(span); sfx.miss();
    if(settings.mode==='hardcore') failRun(); else if(settings.mode==='hard') hardReset(); else { breakCombo(); addGauge(-18); }
  }
  updateCombo(true);
}
function submitWord(){
  const w=words[wi], el=wordEls[wi];
  if(typed===w){
    okChars+=w.length+(isRoma()?0:1); streak++;
    let P=Math.round((w.length*25+streak*5)*multiplier());
    if(crit[wi]){ P*=3; critN++; fxWord(el,P,critC()); fxCrit(el); sfx.crit(); }
    else { fxWord(el,P); sfx.word(streak); }
    addGauge(GAIN_WORD);
  } else {
    el.classList.add('wrong'); sfx.miss();
    if(settings.mode==='hardcore') failRun(); else if(settings.mode==='hard') hardReset(); else { breakCombo(); addGauge(-10); }
    updateCombo(false);
  }
  wi++; typed='';
  checkScroll(); placeCaret(); syncReading();
}
/* ---------- records ---------- */
const REC_KEY='typeburst-records', RANK_N=10, HIST_N=20;
const CATS=[['normal',30],['normal',60],['hard',30],['hard',60],['hardcore',30],['hardcore',60]], TEXTS=Object.keys(TEXT_NAME);
const textOf = r => r.text||'words'; // 出題モード追加前の記録は英単語
const MODE_NAME={normal:'ノーマル', hard:'ハード', hardcore:'ハードコア'};
function loadRecords(){
  let d=null; try{ d=JSON.parse(localStorage.getItem(REC_KEY)); }catch(e){}
  if(!d || !Array.isArray(d.runs)) d={v:1, runs:[]};
  if(!d.migrated){ // 以前の自己ベスト（ノーマルのみ）を記録に引き継ぐ
    [30,60].forEach(dur=>{ let b=0; try{ b=Number(localStorage.getItem('typeburst-bestscore-'+dur))||0; }catch(e){}
      if(b>0) d.runs.unshift({score:b, mode:'normal', dur, date:0}); });
    d.migrated=true;
  }
  return d;
}
function saveRecords(d){ try{ localStorage.setItem(REC_KEY, JSON.stringify(d)); }catch(e){} }
const ranking = (runs,text,mode,dur) => runs.filter(r=>textOf(r)===text && r.mode===mode && r.dur===dur).sort((a,b)=>b.score-a.score || a.date-b.date).slice(0,RANK_N);
function pruneRuns(runs){ // 各区分の上位10件と直近20件だけ残す
  const keep=new Set(runs.slice(-HIST_N));
  TEXTS.forEach(t=>CATS.forEach(([m,d])=>ranking(runs,t,m,d).forEach(r=>keep.add(r))));
  return runs.filter(r=>keep.has(r));
}
const bestFor = (text,mode,dur) => (ranking(loadRecords().runs,text,mode,dur)[0]||{score:0}).score;
function addRun(run){
  const d=loadRecords(), prev=ranking(d.runs,run.text,run.mode,run.dur)[0];
  const best=prev?prev.score:0, isBest = run.score>best && run.score>0;
  d.runs.push(run); d.runs=pruneRuns(d.runs); saveRecords(d);
  return {isBest, best:Math.max(best,run.score)};
}
const fmtDate = t => { if(!t) return '-'; const d=new Date(t), p=n=>String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const dash = v => v==null ? '-' : v;

let recText='words', recMode='normal', recDur=30, recTab='rank', lastRunDate=0;
const fmtDay = t => { if(!t) return '-'; const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()}`; };
const catChip = r => [TEXT_NAME[textOf(r)], MODE_ICON[r.mode], r.dur+'s'].filter(Boolean).join('・');
const catName = (t,m,d) => `${TEXT_NAME[t]}・${MODE_NAME[m]}・${d}秒`;
function renderRecords(){
  const runs=loadRecords().runs, isNow = r => r.date && r.date===lastRunDate;
  const seg=(id,label,cur,opts)=>`<div class="seg" data-f="${id}"><span>${label}</span>${opts.map(([v,t,ti])=>`<button data-v="${v}" class="${String(cur)===String(v)?'on':''}"${ti?` title="${ti}"`:''}>${t}</button>`).join('')}</div>`;
  $('#recFilters').innerHTML =
    seg('text','出題',recText,TEXTS.map(t=>[t,TEXT_NAME[t]]))+
    seg('mode','難易度',recMode,[['normal','ノーマル'],['hard','☠','ハード'],['hardcore','☠☠','ハードコア']])+
    seg('dur','時間',recDur,[[30,'30s'],[60,'60s']]);
  const rank=ranking(runs,recText,recMode,recDur), top=rank[0];
  // 自己ベストのカード
  if(top){
    const st=[[top.wpm,'WPM'],[top.acc!=null?top.acc+'%':null,'正確率'],[top.combo,'最大コンボ'],[top.stage?STAGE_NAMES[top.stage]:null,'最高ステージ']]
      .filter(([v])=>v!=null).map(([v,l])=>`<span><b>${v}</b>${l}</span>`).join('');
    $('#bestCard').innerHTML=`<div class="bc-label"><b>自己ベスト</b>${catName(recText,recMode,recDur)}${isNow(top)?'<span class="bc-new">NEW</span>':''}</div>
      <div class="bc-score">${top.score.toLocaleString()}<small>pts</small></div>
      <div class="bc-stats">${st}<span>${fmtDate(top.date)}</span></div>`;
  } else $('#bestCard').innerHTML=`<div class="bc-empty">まだ記録がありません<small>${catName(recText,recMode,recDur)} で遊んでみよう</small></div>`;
  document.querySelectorAll('.rec-tabs button').forEach(b=>{ const on=b.dataset.tab===recTab; b.classList.toggle('on',on); b.setAttribute('aria-selected',String(on)); });
  // ランキング（2位以降。1位はカード）／最近のプレイ
  if(recTab==='rank'){
    $('#recList').innerHTML = rank.length>1 ? rank.slice(1).map((r,i)=>`<div class="rrow${isNow(r)?' now':''}"><span class="rk r${i+2}">${i+2}</span>
      <span class="sc">${r.score.toLocaleString()}</span><span class="bar"><i style="width:${Math.max(3,r.score/top.score*100).toFixed(1)}%"></i></span>
      <span class="wpm">${dash(r.wpm)}<small>WPM</small></span><span class="dt">${fmtDay(r.date)}</span></div>`).join('')
      : `<p class="empty">${top?'2位以降の記録はまだありません':'この条件の記録はまだありません'}</p>`;
  } else {
    const hist=runs.filter(r=>r.date).sort((a,b)=>b.date-a.date).slice(0,HIST_N);
    $('#recList').innerHTML = hist.length ? hist.map(r=>`<div class="hrow2${isNow(r)?' now':''}"><span class="dt">${fmtDate(r.date)}</span>
      <span class="chip" title="${catName(textOf(r),r.mode,r.dur)}">${catChip(r)}</span><span class="sc">${r.score.toLocaleString()}</span>
      <span class="wpm">${dash(r.wpm)}<small>WPM</small></span></div>`).join('') : '<p class="empty">まだ記録がありません</p>';
  }
}
$('#recFilters').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const f=b.closest('.seg').dataset.f, v=b.dataset.v;
  if(f==='text') recText=v; else if(f==='mode') recMode=v; else recDur=Number(v); renderRecords(); });
document.querySelector('.rec-tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; recTab=b.dataset.tab; renderRecords(); });
const syncScroll = () => document.body.classList.toggle('scrollable', $('#game').hidden); // 結果・記録画面は縦スクロール可
/* 遊び方：数値はゲームの定数から作る */
function renderHelp(){
  const row=(n,x,d,cls='')=>`<div class="hrow ${cls}"><span class="n">${n}</span><span class="x">${x}</span><span class="d">${d}</span></div>`;
  const tiers=theme().tiers;
  $('#helpBody').innerHTML=[
    `<section><h3>難易度</h3>${['normal','hard','hardcore'].map(m=>row(`${MODE_ICON[m]} ${MODE_NAME[m]}`,'×'+MODE_MULT[m],MODE_RULE[m],m==='normal'?'':'danger')).join('')}
      <p>ヘッダーの <b>☠</b>（ハード）と <b>☠☠</b>（ハードコア）で切り替え。選んでいるものをもう一度押すとノーマル。</p></section>`,
    `<section><h3>コンボ</h3>${TIERS.map((t,i)=>row(`<i class="sw" style="background:${tiers[i]}"></i>${t.at}〜`,'×'+TIER_MULT[i],['','ベースが入る','和音が入る','',''][i])).join('')}
      <p>正しく打つたびにコンボが増え、色と倍率が上がる。ミスすると0に戻る。</p></section>`,
    `<section><h3>フィーバー</h3>${STAGE_NAMES.slice(1).map((n,i)=>row(n,'×'+STAGE_MULT[i+1],'BPM '+STAGE_BPM[i+1])).join('')}
      <p>正しく打つとゲージが増え、<b>満タンで1つ上の段階</b>へ。フィーバー中はゲージが減り続け、<b>0で1段階下がる</b>。上の段階ほど貯まりにくく、早く減る。</p></section>`,
    `<section><h3>スコア</h3>
      <p><b>1打</b>：10点 × 倍率</p>
      <p><b>単語を打ち切る</b>：（文字数×25 ＋ 連続正解×5）× 倍率</p>
      <p><b>倍率</b>：コンボ × フィーバー × 難易度</p>
      <p><b style="color:var(--crit)">CRITICAL</b>：金色の単語を打ち切ると ×3。途中でミスすると金色は消える。</p>
      <p>プレイ中は自己ベストまでの差が出て、超えると NEW RECORD。</p></section>`,
    `<section><h3>出題モード</h3>
      <p><b>英単語</b>：ランダムな英単語。スペースで次へ。</p>
      <p><b>英文</b>：短い英文を単語ごとに打つ。スペースで次へ。</p>
      <p><b>ローマ字</b>：日本語の文を文節ごとに打つ。shi/si、tsu/tu、ん の nn など好きな綴りでよい。打ち切ると自動で次へ（スペース不要）。</p></section>`,
    `<section><h3>操作</h3>
      <p><kbd>Tab</kbd> やり直し　<kbd>Enter</kbd> 結果画面からもう一度　<kbd>Esc</kbd> 記録・遊び方を閉じる</p>
      <p>スマホは画面をタップしてキーボードを出す。ローマ字モードは英字キーボードで打つ。</p></section>`
  ].join('');
}
/* 記録・遊び方などの画面の開閉。閉じると、開く前の画面（ゲームか結果）に戻る */
let view=null, viewFrom=null;
function openView(id,render){
  if(view) closeView();
  if(started && !ended) restart(); // プレイ中に開いたらそのゲームは中断
  viewFrom = ended ? '#result' : '#game'; view=id;
  resetKb(); kb.blur();
  $('#game').hidden=true; $('#result').hidden=true; $(id).hidden=false;
  render(); syncCover(); syncScroll();
}
function closeView(){
  if(!view) return;
  $(view).hidden=true; $(viewFrom).hidden=false; view=null; syncCover(); syncScroll();
}
function openRecords(){
  openView('#records',()=>{ recText=settings.text; recMode=settings.mode; recDur=settings.dur; recTab='rank'; renderRecords(); });
}
$('#recBtn').addEventListener('click',e=>{ e.currentTarget.blur(); if(view==='#records') closeView(); else openRecords(); });
$('#recBtn2').addEventListener('click',openRecords);
$('#recClose').addEventListener('click',()=>{ closeView(); if(touchOnly && !ended) focusKb(); });
$('#helpBtn').addEventListener('click',e=>{ e.currentTarget.blur(); if(view==='#help') closeView(); else openView('#help',renderHelp); });
$('#helpClose').addEventListener('click',()=>{ closeView(); if(touchOnly && !ended) focusKb(); });

/* 結果の詳細：WPMの推移グラフ（3秒移動平均）とミスの多いキー */
function renderDetail(T){
  const n=Math.max(2,Math.ceil(T)); secKeys.length=Math.min(secKeys.length,n);
  while(secKeys.length<n) secKeys.push(okKeys);
  const c=[0,...secKeys], W3=3, pts=[];
  for(let i=1;i<=n;i++){ const a=Math.max(0,i-W3); pts.push((c[i]-c[a])/5*60/(i-a)); }
  const peak=Math.max(...pts,0), top=Math.max(20,Math.ceil(peak/20)*20);
  const xy=pts.map((v,i)=>`${(i/(n-1)*100).toFixed(2)},${(100-v/top*100).toFixed(2)}`);
  const grid=[.25,.5,.75].map(k=>`<line class="gd" x1="0" x2="100" y1="${k*100}" y2="${k*100}"/>`).join('');
  $('#rChart').innerHTML=`${grid}<polygon class="ar" points="0,100 ${xy.join(' ')} 100,100"/><polyline class="ln" points="${xy.join(' ')}"/>`;
  $('#rPeak').textContent=`最高 ${Math.round(peak)} WPM`;
  $('#rDur').textContent=n+'秒';
  const miss=Object.entries(missMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  $('#rMiss').innerHTML = miss.length ? miss.map(([k,v])=>`<span><kbd>${esc(k)}</kbd> ×${v}</span>`).join('') : '<span>ミスなし</span>';
}

/* 結果のシェア */
let shareText='';
function makeShareText(wpm,acc){
  const url = location.protocol.startsWith('http') ? ' '+location.origin+location.pathname : '';
  return `typeburst ${score.toLocaleString()}pts [${TEXT_NAME[settings.text]} ${MODE_NAME[settings.mode]} ${settings.dur}秒] ${wpm}WPM 正確率${acc}% 最大${maxCombo}combo`+
    (maxStage?` ${STAGE_NAMES[maxStage]}`:'')+url;
}
function copyText(t){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((ok,ng)=>{ const ta=document.createElement('textarea'); ta.value=t; ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy') ? ok() : ng(); }catch(e){ ng(e); } ta.remove(); });
}
function flashLabel(b,text){ const o=b.dataset.label||(b.dataset.label=b.textContent); b.textContent=text; clearTimeout(b._t); b._t=setTimeout(()=>b.textContent=o,1500); }
$('#shCopy').addEventListener('click',e=>{ const b=e.currentTarget; b.blur();
  copyText(shareText).then(()=>flashLabel(b,'コピーしました'),()=>flashLabel(b,'コピーできませんでした')); });
$('#shX').addEventListener('click',e=>{ e.currentTarget.blur();
  window.open('https://x.com/intent/post?text='+encodeURIComponent(shareText),'_blank','noopener'); });
$('#shNative').hidden = !navigator.share;
$('#shNative').addEventListener('click',e=>{ e.currentTarget.blur(); navigator.share({text:shareText}).catch(()=>{}); });

function end(failedAt){ // failedAt: ハードコアでミスした時点の経過秒数
  const T=failedAt||settings.dur;
  clearInterval(timerId); stopFever(); ended=true; syncGauge();
  resetKb(); kb.blur(); syncCover();
  shards.forEach(s=>score+=s.v); shards.length=0; shown=score;
  const wpm=Math.round(okChars/5/(T/60));
  const acc=allKeys?Math.round(okKeys/allKeys*100):0;
  lastRunDate=Date.now();
  const {isBest, best} = addRun({score, text:settings.text, mode:settings.mode, dur:settings.dur, wpm, acc, combo:maxCombo,
    stage:maxStage, fever:Math.round(feverTime*10)/10, date:lastRunDate});
  $('#rWpm').textContent=wpm; $('#rAcc').textContent=acc+'%'; $('#rCombo').textContent=maxCombo;
  $('#rStage').textContent=maxStage?STAGE_NAMES[maxStage]:'-';
  $('#rCrit').textContent=critN; $('#rFever').textContent=feverTime.toFixed(1)+'秒'; $('#rBest').textContent=best.toLocaleString();
  renderDetail(T); shareText=makeShareText(wpm,acc);
  $('#rFail').hidden=!failedAt; if(failedAt) $('#rFail').textContent=`ミスで終了（${failedAt.toFixed(1)}秒）`;
  $('#game').hidden=true; $('#result').hidden=false; syncScroll();
  const rs=$('#rScore'), total=score, D=Math.min(1700,500+total/40), s0=performance.now(); let last=0;
  rs.textContent='0';
  function countStep(t){
    const k=Math.min(1,(t-s0)/D), e=1-Math.pow(1-k,3);
    rs.textContent=Math.round(total*e).toLocaleString();
    if(k<1){ if(t-last>45){ last=t; sfx.count(e); } requestAnimationFrame(countStep); }
    else land();
  }
  function land(){
    const m=mult(), [x,y]=center(rs);
    spark(x,y,Math.round(90*m),accent(),10,2.8);
    ring(x,y,accent(),Math.max(W,H)*.5,6*m);
    flash.animate([{opacity:.18*Math.min(m,1.4)},{opacity:0}],{duration:500,easing:'ease-out'});
    shake=Math.max(shake,6*m); camPunch(1.04);
    rs.animate([{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:260,easing:'cubic-bezier(.2,1.6,.4,1)'});
    sfx.fanfare(isBest);
    if(isBest){ $('#rNew').hidden=false;
      setTimeout(()=>{ spark(x,y-40,Math.round(50*m),hi(),8,2); ring(x,y,hi(),Math.max(W,H)*.3,3); },350); }
  }
  requestAnimationFrame(countStep);
}
function handleKey(k){
  if(ended) return;
  if(k==='Backspace'){ if(typed.length){ typed=typed.slice(0,-1); if(isRoma()) words[wi]=romaMatch(meta[wi].u,typed); renderWord(wi,typed); placeCaret(); } return; }
  if(k===' '){ if(typed.length && !isRoma()) submitWord(); return; } // ローマ字モードは自動確定なのでスペース不要
  onChar(k);
}

/* 物理キーボード（入力欄にフォーカスがないとき） */
document.addEventListener('keydown',e=>{
  if(!$('#ruleCard').hidden){ e.preventDefault(); hideRuleCard(); return; } // 説明カード表示中の打鍵は閉じるだけ
  if(!themePanel.hidden){ e.preventDefault(); setThemePanel(false); return; } // パネル表示中の打鍵は閉じるだけ
  if(e.key==='Tab'){ e.preventDefault(); initAudio(); restart(); return; }
  if(view){ if(e.key==='Escape'){ e.preventDefault(); closeView(); } return; }
  if(ended){ if(e.key==='Enter'){ e.preventDefault(); restart(); } return; }
  if(e.target===kb) return;               // 入力欄経由の入力は input イベントで処理
  if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing) return;
  if(e.key==='Backspace'||e.key===' '||e.key.length===1){ e.preventDefault(); initAudio(); handleKey(e.key); }
});

/* スマホのソフトウェアキーボード：入力欄の値の差分から打鍵を再現 */
const kb=$('#kb'), tapcover=$('#tapcover');
let prevVal='';
function resetKb(){ kb.value=''; prevVal=''; }
kb.addEventListener('input',()=>{
  if(ended || view){ resetKb(); return; }
  const v=kb.value.toLowerCase();
  let i=0; while(i<prevVal.length && i<v.length && prevVal[i]===v[i]) i++;
  for(let k=prevVal.length;k>i;k--) handleKey('Backspace');
  let spaced=false;
  for(const ch of v.slice(i)){
    if(/\s/.test(ch)){ handleKey(' '); spaced=true; } else handleKey(ch);
  }
  prevVal=v;
  if(spaced) resetKb();
});
kb.addEventListener('keydown',e=>{
  if(e.key==='Enter'){ e.preventDefault(); if(ended) restart(); }
});
const touchOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(pointer: fine)').matches;
function syncCover(){ tapcover.hidden = !touchOnly || ended || document.activeElement===kb; }
function focusKb(){ initAudio(); kb.focus({preventScroll:true}); syncCover(); }
kb.addEventListener('focus',syncCover);
kb.addEventListener('blur',()=>setTimeout(syncCover,50));
wrap.addEventListener('click',focusKb);
$('#restartBtn').addEventListener('click',e=>{ e.currentTarget.blur(); restart(); if(touchOnly) focusKb(); });
$('#again').addEventListener('click',()=>{ initAudio(); restart(); if(touchOnly) focusKb(); });

if(touchOnly){
  const rb=$('#restartBtn');
  $('#hint').innerHTML='<span id="ruleHint"></span><span>ゲージ満タンでフィーバー</span>';
  $('#hint').appendChild(rb);
}

syncOpts(); applyTheme(); resize(); restart(); requestAnimationFrame(loop);
if(document.fonts) document.fonts.ready.then(()=>{ if(wordEls[0]){ lineH=wordEls[0].offsetHeight; placeCaret(); } });
</script>
